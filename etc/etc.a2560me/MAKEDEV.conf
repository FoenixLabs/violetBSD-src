# NetBSD/a2560me local devices. RAW_PART=d, 16 disk partitions.

all_md)
 makedev audio
 makedev ld0 ld1 ld2 ld3 ld4
 makedev ttyU0 ttyU1 tty00 ttyE0 ttyE1 ttyE2 ttyE3 ttyEcfg ttyEstat wskbd0 wsmouse0
 ;;
ramdisk)
 makedev std bpf ld0 ld1 ld2 ld3 ld4 ttyU0 ttyU1 tty00 ttyE0 wskbd0 random
 ;;
tty00)
 mkdev tty00 c 12 0 "" "" $u_uucp
 mkdev dty00 c 12 $dialout "" "" $u_uucp
 ;;
ttyU0)
 mkdev ttyU0 c 13 0 "" "" $u_uucp
 ;;
ttyU1)
 mkdev ttyU1 c 13 1 "" "" $u_uucp
 ;;
